# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./MuuBoi
    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-build --verbosity normal

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Login no GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build e push da imagem
      uses: docker/build-push-action@v6
      with:
        context: ./MuuBoi
        push: true
        tags: |
          ghcr.io/helenasfurb/muuboi:latest
          ghcr.io/helenasfurb/muuboi:${{ github.sha }}

    - name: Login na Azure
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Atualizar o Container App
      uses: azure/cli@v2
      with:
        inlineScript: |
          az containerapp update \
            --name NOME-DO-SEU-CONTAINER-APP \
            --resource-group NOME-DO-SEU-RESOURCE-GROUP \
            --image ghcr.io/helenasfurb/muuboi:${{ github.sha }}
